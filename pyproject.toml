[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-problem-atlas"
version = "0.1.0"
description = "Large-scale, source-informed atlas of internet-native user problems across many verticals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sameer Alam", email = "113900807+Crynge@users.noreply.github.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "playwright>=1.55,<2.0",
]

[project.scripts]
problem-atlas = "internet_problem_atlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
